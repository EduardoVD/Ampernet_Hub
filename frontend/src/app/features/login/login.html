<div class="login-wrapper">
  <aside class="branding-panel">
    <div class="brand-header">
      <h1 class="brand-title">AMPERNET</h1>
      <p class="brand-subtitle">Gerencie seus processos com eficiência e simplicidade.</p>
    </div>

    <ul class="features-list">
      <li><span class="icon">✦</span> Acesso rápido e seguro</li>
      <li><span class="icon">✦</span> Painel completo de gestão</li>
      <li><span class="icon">✦</span> Suporte a múltiplas equipes</li>
    </ul>

    <footer class="brand-footer">
      <p>© 2026 Ampernet Telecom. Todos os direitos reservados.</p>
    </footer>
  </aside>

  <main class="form-panel">
    <div class="form-content">
      <header class="form-header">
        <h2>Bem-vindo de volta</h2>
        <p>Faça login para continuar</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="input-group">
          <label for="email">Seu E-mail</label>
          <div class="input-wrapper">
            <svg class="prefix-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="email@exemplo.com"
            />
          </div>
        </div>

        <div class="input-group">
          <label for="password">Sua Senha</label>
          <div class="input-wrapper">
            <svg class="prefix-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
            />
            <button
              type="button"
              class="suffix-btn"
              (click)="togglePasswordVisibility()"
              title="Alternar visualização da senha"
            >
              <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>

              <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-.722-3.25"/>
                <path d="M2 8a10.645 10.645 0 0 0 20 0"/>
                <path d="m20 15-1.726-2.05"/>
                <path d="m4 15 1.726-2.05"/>
                <path d="m9 18 .722-3.25"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" [disabled]="loginForm.invalid">
          Entrar
        </button>
      </form>
    </div>
  </main>
</div>
