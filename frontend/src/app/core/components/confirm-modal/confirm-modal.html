<div *ngIf="dialog()" class="confirm-backdrop" (click)="onCancel()">
  <div class="confirm-card" [ngClass]="dialog()?.type" (click)="$event.stopPropagation()">
    <header class="confirm-header">
      <div class="icon-circle" [ngClass]="dialog()?.type">
        <svg *ngIf="dialog()?.type === 'danger'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          <line x1="10" y1="11" x2="10" y2="17"/>
          <line x1="14" y1="11" x2="14" y2="17"/>
        </svg>

        <svg *ngIf="dialog()?.type === 'warning'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>

        <svg *ngIf="dialog()?.type === 'primary'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
      </div>

      <h3>{{ dialog()?.title }}</h3>
    </header>

    <div class="confirm-body">
      <p>{{ dialog()?.message }}</p>
    </div>

    <footer class="confirm-footer">
      <button type="button" class="btn-cancel" (click)="onCancel()">
        {{ dialog()?.cancelText || 'Cancelar' }}
      </button>
      <button type="button" class="btn-confirm" [ngClass]="dialog()?.type" (click)="onConfirm()">
        {{ dialog()?.confirmText || 'Confirmar' }}
      </button>
    </footer>
  </div>
</div>
